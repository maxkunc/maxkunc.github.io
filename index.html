<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maxkunc</title>
  <meta name="description" content="maxkunc — projects hosted on GitHub Pages">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #3fb950;
      --blue: #58a6ff;
      --purple: #d2a8ff;
      --orange: #ffa657;
      --red: #ff7b72;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-image: radial-gradient(circle at 20% 10%, rgba(88,166,255,.08), transparent 40%),
                        radial-gradient(circle at 80% 90%, rgba(63,185,80,.07), transparent 40%);
    }
    .window {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .titlebar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #0f141a;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
    .titlebar .path { margin-left: 10px; color: var(--muted); font-size: 13px; }
    .content { padding: 28px 24px 32px; }
    .prompt { color: var(--muted); font-size: 14px; }
    .prompt .user { color: var(--green); }
    .prompt .dir { color: var(--blue); }
    h1 {
      margin: 14px 0 6px;
      font-size: clamp(40px, 11vw, 84px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      word-break: break-word;
    }
    h1 .kw { color: var(--purple); }
    h1 .br { color: var(--muted); font-weight: 400; }
    h1 .name { color: var(--text); }
    .cursor {
      display: inline-block; width: .5em; height: .9em;
      background: var(--green); vertical-align: -0.05em; margin-left: 4px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .comment { color: var(--muted); margin: 10px 0 28px; font-size: 15px; }
    .section { margin-bottom: 12px; font-size: 14px; }
    .section .fn { color: var(--orange); }
    ul.repos { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--border); }
    ul.repos li { border-bottom: 1px dashed var(--border); }
    ul.repos a {
      display: flex; align-items: baseline; gap: 12px;
      padding: 14px 8px;
      color: var(--text); text-decoration: none;
      transition: background .15s, padding-left .15s;
    }
    ul.repos a:hover, ul.repos a:focus-visible {
      background: rgba(88,166,255,.08);
      padding-left: 16px;
      outline: none;
    }
    .idx { color: var(--muted); min-width: 2ch; }
    .arrow { color: var(--green); }
    .repo-name { color: var(--blue); font-weight: 600; }
    .repo-desc { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open { color: var(--muted); font-size: 12px; white-space: nowrap; }
    ul.repos a:hover .open { color: var(--green); }
    .footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
    .footer a { color: var(--blue); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 520px) {
      .repo-desc { display: none; }
      .open { margin-left: auto; }
      .content { padding: 22px 16px 26px; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="path">~/maxkunc.github.io — bash</span>
    </div>
    <div class="content">
      <div class="prompt"><span class="user">max@github</span>:<span class="dir">~</span>$ whoami</div>
      <h1><span class="kw">&lt;</span><span class="name">maxkunc</span><span class="kw"> /&gt;</span><span class="cursor"></span></h1>
      <p class="comment">// projects live on GitHub Pages — pick one to open</p>

      <div class="section"><span class="prompt"><span class="user">max@github</span>:<span class="dir">~</span>$</span> <span class="fn">ls</span> ./pages</div>
      <ul class="repos" id="repos">
        <!-- fallback list; refreshed from the GitHub API on load -->
        <li><a href="https://maxkunc.github.io/apalucha/"><span class="idx">01</span><span class="arrow">▸</span><span class="repo-name">apalucha</span><span class="repo-desc"></span><span class="open">open ↗</span></a></li>
        <li><a href="https://maxkunc.github.io/psjgtools/"><span class="idx">02</span><span class="arrow">▸</span><span class="repo-name">psjgtools</span><span class="repo-desc"></span><span class="open">open ↗</span></a></li>
        <li><a href="https://maxkunc.github.io/vinotekaumazlika/"><span class="idx">03</span><span class="arrow">▸</span><span class="repo-name">vinotekaumazlika</span><span class="repo-desc"></span><span class="open">open ↗</span></a></li>
        <li><a href="https://maxkunc.github.io/zitnyeu/"><span class="idx">04</span><span class="arrow">▸</span><span class="repo-name">zitnyeu</span><span class="repo-desc"></span><span class="open">open ↗</span></a></li>
      </ul>

      <div class="footer">
        <span class="prompt">$</span> open <a href="https://github.com/maxkunc">github.com/maxkunc</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var USER = "maxkunc";
      var list = document.getElementById("repos");
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var esc = function (s) {
        return String(s || "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      };

      fetch("https://api.github.com/users/" + USER + "/repos?per_page=100&sort=updated")
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (repos) {
          var pages = repos.filter(function (r) {
            return r.has_pages && !r.archived && r.name.toLowerCase() !== (USER + ".github.io");
          }).sort(function (a, b) { return a.name.localeCompare(b.name); });
          if (!pages.length) return;
          list.innerHTML = pages.map(function (r, i) {
            var url = r.homepage && /^https?:\/\//.test(r.homepage)
              ? r.homepage
              : "https://" + USER + ".github.io/" + r.name + "/";
            return '<li><a href="' + esc(url) + '">' +
              '<span class="idx">' + pad(i + 1) + '</span>' +
              '<span class="arrow">▸</span>' +
              '<span class="repo-name">' + esc(r.name) + '</span>' +
              '<span class="repo-desc">' + (r.description ? "// " + esc(r.description) : "") + '</span>' +
              '<span class="open">open ↗</span></a></li>';
          }).join("");
        })
        .catch(function () { /* keep the static fallback list */ });
    })();
  </script>
</body>
</html>
